name: Actualizar datos

# Corre una vez al día y también a mano desde la pestaña Actions (workflow_dispatch).
# Está programado para las 4:37 a. m. de Bogotá (9:37 UTC), fuera de la hora en punto, cuando GitHub
# tiene menos fila; aun así GitHub puede arrancarlo varias horas después.
on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar datos de NOAA, IDEAM, XM y NASA
        run: python scripts/actualizar_datos.py
      - name: Guardar los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos del $(date -u +%Y-%m-%d)"
            git push
          fi
