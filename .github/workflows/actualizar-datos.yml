name: Actualizar datos

# Todos los días a las 6:00 a. m. de Bogotá (11:00 UTC) y cuando se pida a mano.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar datos de NOAA, IDEAM, XM y NASA
        run: python scripts/actualizar_datos.py
      - name: Guardar los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos del $(date -u +%Y-%m-%d)"
            git push
          fi
